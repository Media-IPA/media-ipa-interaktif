        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Custom Scrollbar for independent screen scrolling */
        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.4);
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.7);
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .correct-pulse {
            animation: correctPulse 0.5s ease-out;
        }
        @keyframes correctPulse {
            0% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1.01); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-locked {
            background-color: #14532d !important;
            border-color: #22c55e !important;
            color: #86efac !important;
            font-weight: 700;
            cursor: not-allowed;
            user-select: none;
        }

        .g-key-btn {

            color: white;
            font-weight: 700;
            border-radius: 6px;
            padding: 5px 2px;
            text-align: center;
            font-size: 0.8rem;
            transition: all 0.1s ease;
            user-select: none;

        .g-key-btn:active {

            background: #1e293b;
            color: #38bdf8;

            font-size: 0.7rem;
            user-select: none;
        }
        .g-unit-btn:active {

            color: white;

            { id: "A6", section: "A", secTitle: "📏 A. Konversi Satuan Panjang", num: 6, label: "Soal A-6", hint: "(7 km = ... cm)", valid: ["700000", "700.000", "700000 cm", "700.000 cm", "700000cm", "700.000cm"] },
            { id: "A7", section: "A", secTitle: "📏 A. Konversi Satuan Panjang", num: 7, label: "Soal A-7", hint: "(850 cm = ...)", valid: ["8 m 50 cm", "8m 50cm", "8 m dan 50 cm", "8m dan 50cm", "8,5 m", "8.5 m", "8,5", "8.5", "8m 50 cm", "8 m 50cm", "8,5m", "8.5m", "8m, 50cm"] },
            { id: "A8", section: "A", secTitle: "📏 A. Konversi Satuan Panjang", num: 8, label: "Soal A-8", hint: "(2m + 150cm = ... cm)", valid: ["350", "350 cm", "350cm", "3,5 m", "3.5 m", "3,5m", "3.5m", "3,5", "3.5"] },
            { id: "A9", section: "A", secTitle: "📏 A. Konversi Satuan Panjang", num: 9, label: "Soal A-9", hint: "(1.200 m = ...)", valid: ["1,2", "1.2", "1,2 km", "1.2 km", "1,2km", "1.2km", "1 km 200 m", "1km 200m", "1 km 200m", "1km 200 m", "1 km dan 200 m"] },
            { id: "A10", section: "A", secTitle: "📏 A. Konversi Satuan Panjang", num: 10, label: "Soal A-10", hint: "(250 mm = ... cm)", valid: ["25", "25 cm", "25cm", "0,25 m", "0.25 m", "0,25", "0.25"] },

            // Section B: Konversi Satuan Massa
            { id: "B1", section: "B", secTitle: "⚖️ B. Konversi Satuan Massa", num: 1, label: "Soal B-1", hint: "(3 ton = ... kg)", valid: ["3000", "3.000", "3000 kg", "3.000 kg", "3000kg", "3.000kg"] },
            { id: "B2", section: "B", secTitle: "⚖️ B. Konversi Satuan Massa", num: 2, label: "Soal B-2", hint: "(2.500 g = ...)", valid: ["2 kg dan 500 g", "2kg dan 500g", "2 kg 500 g", "2kg 500g", "2 kg, 500 g", "2kg,500g", "2 kg 500g", "2,5 kg", "2.5 kg", "2,5kg", "2.5kg", "2,5", "2.5"] },
            { id: "B3", section: "B", secTitle: "⚖️ B. Konversi Satuan Massa", num: 3, label: "Soal B-3", hint: "(5 kuintal = ... kg)", valid: ["500", "500 kg", "500kg"] },
            { id: "B4", section: "B", secTitle: "⚖️ B. Konversi Satuan Massa", num: 4, label: "Soal B-4", hint: "(2 kg = ... g)", valid: ["2000", "2.000", "2000 g", "2.000 g", "2000g", "2.000g"] },
            { id: "B5", section: "B", secTitle: "⚖️ B. Konversi Satuan Massa", num: 5, label: "Soal B-5", hint: "(4.000 mg = ... g)", valid: ["4", "4 g", "4g"] },

            { id: "B8", section: "B", secTitle: "⚖️ B. Konversi Satuan Massa", num: 8, label: "Soal B-8", hint: "(2.300 kg = ...)", valid: ["2,3", "2.3", "2,3 ton", "2.3 ton", "2,3ton", "2.3ton", "2 ton 300 kg", "2ton 300kg", "2 ton 300kg", "2 ton dan 300 kg", "2300 kg", "2.300 kg"] },
            { id: "B9", section: "B", secTitle: "⚖️ B. Konversi Satuan Massa", num: 9, label: "Soal B-9", hint: "(750g + ... g = 1 kg)", valid: ["250", "250 g", "250g", "0,25 kg", "0.25 kg"] },
            { id: "B10", section: "B", secTitle: "⚖️ B. Konversi Satuan Massa", num: 10, label: "Soal B-10", hint: "(500mg × 10 = ...)", valid: ["5", "5 g", "5g", "5000 mg", "5.000 mg", "5000mg", "5.000mg", "5000", "5.000"] },

            // Section C: Konversi Satuan Waktu
            { id: "C1", section: "C", secTitle: "⏰ C. Konversi Satuan Waktu", num: 1, label: "Soal C-1", hint: "(3 hari = ... jam)", valid: ["72", "72 jam", "72jam"] },
            { id: "C2", section: "C", secTitle: "⏰ C. Konversi Satuan Waktu", num: 2, label: "Soal C-2", hint: "(2 jam = ... menit)", valid: ["120", "120 menit", "120menit", "120 mnt"] },

            { id: "C10", section: "C", secTitle: "⏰ C. Konversi Satuan Waktu", num: 10, label: "Soal C-10", hint: "(10.800 sekon = ... jam)", valid: ["3", "3 jam", "3jam"] }
        ];

        // State Tracking for 4 Groups with Independent Active Focus & Keyboard State
        let appState = {
            audioEnabled: true,
            layoutGrid: true,
            groups: {
                1: { name: "Kelompok 1", answers: {}, activeInput: "A1", keyboardVisible: true },
                2: { name: "Kelompok 2", answers: {}, activeInput: "A1", keyboardVisible: true },
                3: { name: "Kelompok 3", answers: {}, activeInput: "A1", keyboardVisible: true },
                4: { name: "Kelompok 4", answers: {}, activeInput: "A1", keyboardVisible: true }
            }
        };

        // Initialize Audio Synthesizer (Web Audio API)
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!appState.audioEnabled) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                if (type === 'correct') {
                    const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        gain.gain.setValueAtTime(0.3, now + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.3);
                    });
                } else if (type === 'wrong') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'win') {
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                        gain.gain.setValueAtTime(0.4, now + idx * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.12);
                        osc.stop(now + idx * 0.12 + 0.4);
                    });
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        function toggleAudio() {
            appState.audioEnabled = !appState.audioEnabled;
            const btn = document.getElementById('audioToggleBtn');
            if (appState.audioEnabled) {
                btn.innerHTML = `<i class="fa-solid fa-volume-high" id="audioIcon"></i> <span class="hidden sm:inline">Suara: ON</span>`;
                btn.className = "bg-slate-800 hover:bg-slate-700 text-emerald-400 px-3 py-2 rounded-xl border border-slate-700 transition text-xs flex items-center gap-1.5 font-semibold";
            } else {
                btn.innerHTML = `<i class="fa-solid fa-volume-xmark" id="audioIcon"></i> <span class="hidden sm:inline">Suara: OFF</span>`;
                btn.className = "bg-slate-800 hover:bg-slate-700 text-slate-500 px-3 py-2 rounded-xl border border-slate-700 transition text-xs flex items-center gap-1.5 font-semibold";
            }
            saveState();
        }

        function toggleLayoutMode() {
            appState.layoutGrid = !appState.layoutGrid;
            const container = document.getElementById('groupsGridContainer');
            if (appState.layoutGrid) {
                container.className = "grid grid-cols-1 md:grid-cols-2 gap-3 h-[calc(100vh-75px)]";
            } else {
                container.className = "grid grid-cols-1 gap-3 h-[calc(100vh-75px)] overflow-y-auto";
            }
        }

        // Render UI for all 4 groups
        function renderAllGroups() {
            for (let g = 1; g <= 4; g++) {
                renderGroupContent(g);
                renderGroupKeyboard(g);
                updateGroupProgress(g);
            }
        }

        function setGroupActiveInput(groupId, qId) {
            appState.groups[groupId].activeInput = qId;
            quizData.forEach(q => {
                const el = document.getElementById(`wrapper_g${groupId}_${q.id}`);
                if (el) {
                    if (q.id === qId) {
                        el.classList.add('ring-2', 'ring-teal-400');
                    } else {
                        el.classList.remove('ring-2', 'ring-teal-400');
                    }
                }
            });
            renderGroupKeyboard(groupId);
        }

        function renderGroupContent(groupId) {
            const container = document.getElementById(`k${groupId}-content`);
            if (!container) return;

            let html = '';

            const sections = [
                { key: "A", title: "📏 A. Konversi Satuan Panjang", badgeColor: "bg-emerald-500/20 text-emerald-300 border-emerald-500/40" },
                { key: "B", title: "⚖️ B. Konversi Satuan Massa", badgeColor: "bg-amber-500/20 text-amber-300 border-amber-500/40" },
                { key: "C", title: "⏰ C. Konversi Satuan Waktu", badgeColor: "bg-purple-500/20 text-purple-300 border-purple-500/40" }
            ];

            sections.forEach(sec => {
                const secItems = quizData.filter(q => q.section === sec.key);
                
                html += `
                <div class="bg-slate-900/60 rounded-xl border border-slate-800 p-2.5 shadow-inner">
                    <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-slate-800">
                        <h3 class="font-bold text-xs md:text-sm text-slate-200 flex items-center gap-1.5">
                            ${sec.title}
                        </h3>
                        <span class="text-[10px] px-2 py-0.5 rounded-full font-bold border ${sec.badgeColor}">
                            10 Soal
                        </span>
                    </div>
                    <div class="grid grid-cols-1 gap-1.5">
                `;

                secItems.forEach(item => {
                    const inputId = `g${groupId}_${item.id}`;
                    const isDone = appState.groups[groupId].answers[item.id] === true;
                    const isActive = appState.groups[groupId].activeInput === item.id;

                    html += `
                    <div id="wrapper_${inputId}" class="flex items-center justify-between gap-1.5 p-1.5 rounded-lg bg-slate-800/60 border border-slate-700/50 hover:border-slate-600 transition ${isDone ? 'correct-pulse bg-emerald-950/30 border-emerald-500/40' : ''} ${isActive && !isDone ? 'ring-2 ring-teal-400' : ''}">
                        <div class="flex items-center gap-1.5 min-w-0">
                            <span class="font-black text-[11px] px-1.5 py-0.5 rounded bg-slate-900 text-slate-300 border border-slate-700">${item.label}</span>
                            <span class="text-[11px] text-slate-400 truncate hidden sm:inline">${item.hint}</span>
                        </div>

                        <div class="flex items-center gap-1">
                            ${isDone ? `
                                <div class="input-locked px-2.5 py-1 rounded text-[11px] flex items-center gap-1 shadow">
                                    <i class="fa-solid fa-lock text-emerald-400"></i>
                                    <span class="tracking-widest">••••••••</span>
                                    <i class="fa-solid fa-circle-check text-emerald-400 text-xs"></i>
                                </div>
                            ` : `
                                <input type="text" id="${inputId}" placeholder="Jawaban..." 
                                    onfocus="setGroupActiveInput(${groupId}, '${item.id}')"
                                    onkeydown="handleKeyDown(event, ${groupId}, '${item.id}')"
                                    class="w-24 sm:w-32 bg-slate-900 text-white text-xs font-semibold px-2 py-1 rounded border border-slate-700 focus:outline-none focus:border-teal-400 transition" />
                                
                                <button onclick="submitAnswer(${groupId}, '${item.id}')" title="Cek Jawaban" class="bg-teal-600 hover:bg-teal-500 text-slate-950 font-bold px-2 py-1 rounded text-xs transition shadow flex items-center gap-1">
                                    <span>Cek</span>
                                </button>
                            `}
                        </div>
                    </div>
                    `;
                });

                html += `
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        // Render Dedicated Keyboard Panel for Each Group
        function renderGroupKeyboard(groupId) {
            const kpContainer = document.getElementById(`k${groupId}-keypad`);
            if (!kpContainer) return;

            if (!appState.groups[groupId].keyboardVisible) {
                kpContainer.className = "hidden";
                return;
            }

            kpContainer.className = "bg-slate-950/95 border-t border-slate-800 p-2 z-30";

            const activeQId = appState.groups[groupId].activeInput || 'A1';
            const activeItem = quizData.find(q => q.id === activeQId) || quizData[0];

            let html = `
            <div class="flex items-center justify-between mb-1.5 text-[11px]">
                <span class="font-extrabold text-teal-300 flex items-center gap-1">
                    <i class="fa-solid fa-keyboard"></i> Keyboard K${groupId} (<span class="text-white">${activeItem.label}</span>)
                </span>
                <span class="text-[10px] text-slate-400">Pilih soal ➔ Ketik ➔ Cek</span>
            </div>

            <!-- Unit & Word Shortcuts -->
            <div class="grid grid-cols-7 gap-1 mb-1.5">
                <button onclick="groupKeyInsert(${groupId}, ' m')" class="g-unit-btn">m</button>
                <button onclick="groupKeyInsert(${groupId}, ' km')" class="g-unit-btn">km</button>
                <button onclick="groupKeyInsert(${groupId}, ' cm')" class="g-unit-btn">cm</button>
                <button onclick="groupKeyInsert(${groupId}, ' mm')" class="g-unit-btn">mm</button>
                <button onclick="groupKeyInsert(${groupId}, ' kg')" class="g-unit-btn">kg</button>
                <button onclick="groupKeyInsert(${groupId}, ' g')" class="g-unit-btn">g</button>
                <button onclick="groupKeyInsert(${groupId}, ' mg')" class="g-unit-btn">mg</button>

                <button onclick="groupKeyInsert(${groupId}, ' ton')" class="g-unit-btn">ton</button>
                <button onclick="groupKeyInsert(${groupId}, ' jam')" class="g-unit-btn">jam</button>
                <button onclick="groupKeyInsert(${groupId}, ' menit')" class="g-unit-btn">menit</button>
                <button onclick="groupKeyInsert(${groupId}, ' sekon')" class="g-unit-btn">sekon</button>
                <button onclick="groupKeyInsert(${groupId}, ' dan ')" class="g-unit-btn">dan</button>
                <button onclick="groupKeyInsert(${groupId}, ',')" class="g-unit-btn">,</button>
                <button onclick="groupKeyInsert(${groupId}, '.')" class="g-unit-btn">.</button>
            </div>

            <!-- Numpad Controls -->
            <div class="grid grid-cols-6 gap-1">
                <button onclick="groupKeyInsert(${groupId}, '1')" class="g-key-btn">1</button>
                <button onclick="groupKeyInsert(${groupId}, '2')" class="g-key-btn">2</button>
                <button onclick="groupKeyInsert(${groupId}, '3')" class="g-key-btn">3</button>
                <button onclick="groupKeyInsert(${groupId}, '4')" class="g-key-btn">4</button>
                <button onclick="groupKeyInsert(${groupId}, '5')" class="g-key-btn">5</button>
                <button onclick="groupKeyBackspace(${groupId})" class="g-key-btn bg-red-950/80 text-red-300 border border-red-800/60">⌫</button>

                <button onclick="groupKeyInsert(${groupId}, '6')" class="g-key-btn">6</button>
                <button onclick="groupKeyInsert(${groupId}, '7')" class="g-key-btn">7</button>
                <button onclick="groupKeyInsert(${groupId}, '8')" class="g-key-btn">8</button>
                <button onclick="groupKeyInsert(${groupId}, '9')" class="g-key-btn">9</button>
                <button onclick="groupKeyInsert(${groupId}, '0')" class="g-key-btn">0</button>
                <button onclick="groupKeySubmit(${groupId})" class="g-key-btn bg-teal-600 hover:bg-teal-500 text-slate-950 font-extrabold flex items-center justify-center text-xs">✓ Jawab</button>
            </div>
            `;

            kpContainer.innerHTML = html;
        }

        function toggleGroupKeyboard(groupId) {
            appState.groups[groupId].keyboardVisible = !appState.groups[groupId].keyboardVisible;
            renderGroupKeyboard(groupId);
            saveState();
        }

        // Group Keypad Actions
        function groupKeyInsert(groupId, text) {
            const activeQId = appState.groups[groupId].activeInput || 'A1';
            const inputId = `g${groupId}_${activeQId}`;
            const inp = document.getElementById(inputId);
            if (!inp) return;

            const start = inp.selectionStart || inp.value.length;
            const end = inp.selectionEnd || inp.value.length;
            const val = inp.value;

            inp.value = val.substring(0, start) + text + val.substring(end);
            inp.focus();
            inp.setSelectionRange(start + text.length, start + text.length);
        }

        function groupKeyBackspace(groupId) {
            const activeQId = appState.groups[groupId].activeInput || 'A1';
            const inputId = `g${groupId}_${activeQId}`;
            const inp = document.getElementById(inputId);
            if (!inp || !inp.value) return;

            const start = inp.selectionStart || inp.value.length;
            const end = inp.selectionEnd || inp.value.length;
            const val = inp.value;

            if (start === end && start > 0) {
                inp.value = val.substring(0, start - 1) + val.substring(start);
                inp.setSelectionRange(start - 1, start - 1);
            } else {
                inp.value = val.substring(0, start) + val.substring(end);
                inp.setSelectionRange(start, start);
            }
            inp.focus();
        }

        function groupKeySubmit(groupId) {
            const activeQId = appState.groups[groupId].activeInput || 'A1';
            submitAnswer(groupId, activeQId);
        }

        // Comprehensive Robust String Normalization & Matcher
        function cleanStr(s) {
            if (!s) return '';
            return s.toString()
                .toLowerCase()
                .replace(/dan/g, ' ')
                .replace(/atau/g, ' ')
                .replace(/,/g, '.')
                .replace(/(\d+)\s*\.\s*(\d{3})/g, '$1$2') // strip 1st level thousand dots (e.g. 5.000 -> 5000)
                .replace(/(\d+)\s*\.\s*(\d{3})/g, '$1$2') // strip 2nd level thousand dots (e.g. 7000.000 -> 7000000)
                .replace(/[\;\:\-]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function isAnswerCorrect(userVal, validList) {
            if (!userVal) return false;
            let normUser = cleanStr(userVal);
            let normUserNoSpaces = normUser.replace(/\s+/g, '');
            
            for (let v of validList) {
                let normValid = cleanStr(v);
                let normValidNoSpaces = normValid.replace(/\s+/g, '');

                if (normUser === normValid) return true;
                if (normUserNoSpaces === normValidNoSpaces) return true;
            }
            return false;
        }

        function submitAnswer(groupId, qId) {
            const inputId = `g${groupId}_${qId}`;
            const inputEl = document.getElementById(inputId);
            const wrapperEl = document.getElementById(`wrapper_${inputId}`);
            if (!inputEl) return;

            const userVal = inputEl.value;
            const targetQ = quizData.find(q => q.id === qId);

            if (isAnswerCorrect(userVal, targetQ.valid)) {
                // CORRECT!
                appState.groups[groupId].answers[qId] = true;
                playSound('correct');
                saveState();
                
                // Auto-advance focus to next unsolved question in group
                const unsolved = quizData.find(q => !appState.groups[groupId].answers[q.id]);
                if (unsolved) {
                    appState.groups[groupId].activeInput = unsolved.id;
                }

                renderGroupContent(groupId);
                renderGroupKeyboard(groupId);
                updateGroupProgress(groupId);
            } else {
                // WRONG!
                playSound('wrong');
                if (wrapperEl) {
                    wrapperEl.classList.remove('shake');
                    void wrapperEl.offsetWidth; // trigger reflow
                    wrapperEl.classList.add('shake');
                }
                inputEl.classList.add('border-red-500', 'bg-red-950/40');
                setTimeout(() => {
                    if (inputEl) inputEl.classList.remove('border-red-500', 'bg-red-950/40');
                }, 1000);
            }
        }

        function handleKeyDown(event, groupId, qId) {
            if (event.key === 'Enter') {
                event.preventDefault();
                submitAnswer(groupId, qId);
            }
        }

        function updateGroupProgress(groupId) {
            const answers = appState.groups[groupId].answers;
            const countDone = Object.keys(answers).filter(k => answers[k] === true).length;
            const total = quizData.length; // 30
            const pct = Math.round((countDone / total) * 100);

            const txt = document.getElementById(`k${groupId}-progress-text`);
            const bar = document.getElementById(`k${groupId}-progress-bar`);

            if (txt) txt.innerText = `Progress: ${countDone} / ${total} Terjawab`;
            if (bar) bar.style.width = `${pct}%`;

            if (countDone === total && !appState.groups[groupId].celebrated) {
                appState.groups[groupId].celebrated = true;
                playSound('win');
                alert(`🎉 SELAMAT! ${appState.groups[groupId].name} telah menyelesaikan semua soal Kuis Konversi Satuan dengan sempurna!`);
                saveState();
            }
        }

        // Reset Functions
        function resetGroup(groupId) {
            if (confirm(`Apakah Anda yakin ingin mereset hasil ${appState.groups[groupId].name}?`)) {
                appState.groups[groupId].answers = {};
                appState.groups[groupId].activeInput = "A1";
                appState.groups[groupId].celebrated = false;
                saveState();
                renderGroupContent(groupId);
                renderGroupKeyboard(groupId);
                updateGroupProgress(groupId);
            }
        }

        function confirmResetAll() {
            if (confirm('Apakah Anda yakin ingin mereset seluruh jawaban keempat kelompok?')) {
                for (let g = 1; g <= 4; g++) {
                    appState.groups[g].answers = {};
                    appState.groups[g].activeInput = "A1";
                    appState.groups[g].celebrated = false;
                }
                saveState();
                renderAllGroups();
            }
        }

        // State Persistence
        function saveState() {
            for (let g = 1; g <= 4; g++) {
                const nameEl = document.getElementById(`k${g}-name`);
                if (nameEl) appState.groups[g].name = nameEl.value;
            }
            localStorage.setItem('ipa_konversi_lkpd_state', JSON.stringify(appState));
        }

        function loadState() {
            const saved = localStorage.getItem('ipa_konversi_lkpd_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.groups) {
                        appState = parsed;
                    }
                } catch (e) {
                    console.log("State load error:", e);
                }
            }

            // Restore group names in input fields
            for (let g = 1; g <= 4; g++) {
                const nameEl = document.getElementById(`k${g}-name`);
                if (nameEl && appState.groups[g].name) {
                    nameEl.value = appState.groups[g].name;
                }
            }
        }

        // Initialize App on Page Load
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            renderAllGroups();
        });
    </script>
</body>
</html>
