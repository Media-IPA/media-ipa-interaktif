<script>
const L = [

const COL = ["#e8573a", "#16998f", "#d9a100", "#7a5cff"];
const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().replace(/[^a-z]/g, "");
let T = [], TE = false, MU = false, FIN = 0, ac;

function beep(f, d = .12, ty = "sine") {
    if (MU) return;
    try {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === "suspended") ac.resume();
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = ty;
        o.frequency.value = f;
        g.gain.value = .08;
        o.connect(g);
        g.connect(ac.destination);
        o.start();
        o.stop(ac.currentTime + d);
    } catch (e) {}
}

const win = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .15), i * 110));

// Cegah zoom gesture browser
["gesturestart", "gesturechange", "gestureend", "contextmenu", "dblclick"].forEach(e => document.addEventListener(e, x => x.preventDefault()));
document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

/* ==========================================================================
   MULTI-TOUCH SIMULTANEOUS SCROLL & TYPING ENGINE
   (Anti-Lock, Anti-Freezing, Bebas Macet di Papan Tulis Digital)
   ========================================================================== */
const scrollTrackers = new Map();
const glidingAnims = new Map();

function attachMultiTouchScroll(container) {
    if (!container || container._mtsActive) return;
    container._mtsActive = true;

    container.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        if (glidingAnims.has(container)) {
            cancelAnimationFrame(glidingAnims.get(container));
            glidingAnims.delete(container);
        }
        scrollTrackers.set(e.pointerId, {
            container: container,
            startX: e.clientX,
            startY: e.clientY,
            lastY: e.clientY,
            lastTime: performance.now(),
            velocityY: 0,
            hasDragged: false
        });
        // JANGAN panggil setPointerCapture di pointerdown!
        // Hanya panggil setPointerCapture jika sudah terbukti dragging di pointermove
    }, { passive: false });
}

window.addEventListener('pointermove', (e) => {
    const tracker = scrollTrackers.get(e.pointerId);
    if (!tracker) return;

    const currentY = e.clientY;
    const currentX = e.clientX;
    const deltaY = currentY - tracker.lastY;
    const totalDistY = Math.abs(currentY - tracker.startY);
    const totalDistX = Math.abs(currentX - tracker.startX);
    const now = performance.now();
    const dt = now - tracker.lastTime;

    if (!tracker.hasDragged && (totalDistY > 7 || totalDistX > 7)) {
        tracker.hasDragged = true;
        try {
            tracker.container.setPointerCapture(e.pointerId);
        } catch (err) {}
    }

    if (tracker.hasDragged) {
        if (e.cancelable) e.preventDefault();
        tracker.container.scrollTop -= deltaY;
        if (dt > 0) {
            const instantV = deltaY / dt;
            tracker.velocityY = tracker.velocityY * 0.35 + instantV * 0.65;
        }
    }

    tracker.lastY = currentY;
    tracker.lastTime = now;
}, { passive: false });

const handleGlobalPointerEnd = (e) => {
    const tracker = scrollTrackers.get(e.pointerId);
    if (!tracker) return;

    const container = tracker.container;
    try {
        if (container.hasPointerCapture(e.pointerId)) {
            container.releasePointerCapture(e.pointerId);
        }
    } catch (err) {}

    const timeSinceLast = performance.now() - tracker.lastTime;
    if (tracker.hasDragged) {
        const suppressClick = (ev) => {
            ev.stopImmediatePropagation();
            ev.preventDefault();
        };
        window.addEventListener('click', suppressClick, { capture: true, once: true });
        setTimeout(() => {
            window.removeEventListener('click', suppressClick, { capture: true });
        }, 160);

        let v = timeSinceLast < 120 ? tracker.velocityY : 0;
        if (v > 2.5) v = 2.5;
        if (v < -2.5) v = -2.5;
        if (Math.abs(v) > 0.08) {
            startInertiaGliding(container, v);
        }
    }

    scrollTrackers.delete(e.pointerId);
};

window.addEventListener('pointerup', handleGlobalPointerEnd, { passive: false });
window.addEventListener('pointercancel', handleGlobalPointerEnd, { passive: false });

function startInertiaGliding(container, initialVelocity) {
    let velocity = initialVelocity;
    const friction = 0.92;
    let lastTime = performance.now();

    function step(now) {
        const dt = Math.min(now - lastTime, 32);
        lastTime = now;
        container.scrollTop -= velocity * dt;
        velocity *= friction;
        if (Math.abs(velocity) > 0.02) {
            const id = requestAnimationFrame(step);
            glidingAnims.set(container, id);
        } else {
            glidingAnims.delete(container);
        }
    }
    const id = requestAnimationFrame(step);
    glidingAnims.set(container, id);
}

function scrollCol(i, dir, e) {
    if (e && e.cancelable) e.preventDefault();
    const b = $("b" + i);
    if (!b) return;
    b.scrollBy({ top: 130 * dir, behavior: "smooth" });
}

/* TAP VS DRAG HANDLERS (PASTIKAN SOAL BISA DIBUKA 100%) */
let lastTileTriggerTime = 0;

function handleTileUp(e, i, k) {
    const tracker = scrollTrackers.get(e.pointerId);
    if (tracker && tracker.hasDragged) return; // sedang dragging scroll, jangan buka
    lastTileTriggerTime = Date.now();
    if (e.cancelable) e.preventDefault();
    O(i, 'q', k);
}

function handleTileClick(e, i, k) {
    if (Date.now() - lastTileTriggerTime < 250) return; // sudah ditangani oleh pointerup
    O(i, 'q', k);
}

let lastLockTriggerTime = 0;

function handleLockUp(e, i) {
    const tracker = scrollTrackers.get(e.pointerId);
    if (tracker && tracker.hasDragged) return;
    lastLockTriggerTime = Date.now();
    if (e.cancelable) e.preventDefault();
    O(i, 'lock');
}

function handleLockClick(e, i) {
    if (Date.now() - lastLockTriggerTime < 250) return;
    O(i, 'lock');
}

/* KEYBOARD TYPING HANDLER (0ms MULTI-SENTUH SIMULTAN) */
function pressKey(e, i, c) {
    if (e) {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
    }
    K(i, c);
}

function pressClose(e, i) {
    if (e && e.cancelable) e.preventDefault();
    close_(i);
}

function pressNext(e, i) {
    if (e && e.cancelable) e.preventDefault();
    nextLv(i);
}

/* ==========================================================================
   GAME ENGINE & LOGIC
   ========================================================================== */
(function() {
    $("nm").innerHTML = [0, 1, 2, 3].map(i => `
        <input id="n${i}" value="Kelompok ${i + 1}" aria-label="Nama kelompok ${i + 1}" style="border-color:${COL[i]}">
    `).join("");
})();

function start() {
    T = [0, 1, 2, 3].map(i => ({
        name: ($("n" + i).value || "").trim() || "Kelompok " + (i + 1),
        score: 0,
        lv: 0,
        sv: [{}, {}, {}],
        h: {},
        mode: null,
        cur: null,
        buf: "",
        fin: 0
    }));
    FIN = 0;
    $("intro").style.display = "none";
    $("grid").innerHTML = T.map((t, i) => `
        <div class="q" style="--c:${COL[i]}" id="q${i}">
            <div class="hd" id="h${i}"></div>
            <div class="bd" id="b${i}"></div>
            <div class="ov" id="o${i}"></div>
        </div>
    `).join("");
    T.forEach((_, i) => R(i));
    beep(660);
}

function top_() {
    $("sc").innerHTML = T.map((t, i) => `
        <span style="color:${["#ff9d86", "#6fe3d9", "#ffd966", "#b9a8ff"][i]}; font-size:13px;">
            ${t.name}: ${t.score}${t.fin ? " ✔" + t.fin : ""}
        </span>
    `).join("");
}

function R(i) {
    const t = T[i], v = L[Math.min(t.lv, 2)], b = $("b" + i), st = b.scrollTop, sv = t.sv[Math.min(t.lv, 2)];
    top_();

    $("h" + i).innerHTML = `
        <div class="hd-left">
            <span class="hd-name">🚩 ${t.name}</span>
            <span class="hd-sc-btns">
                <button type="button" class="nav-sc-btn" onpointerdown="scrollCol(${i}, -1, event)" title="Scroll Atas">▲</button>
                <button type="button" class="nav-sc-btn" onpointerdown="scrollCol(${i}, 1, event)" title="Scroll Bawah">▼</button>
            </span>
        </div>
        <div class="hd-right">
            <span>${t.mode == "end" ? "🏆" : v.e + " Lv " + (t.lv + 1)}</span>
            <span class="hd-score">⭐ ${t.score}</span>
        </div>
    `;

    b.className = "bd l" + (t.mode == "end" ? 3 : t.lv);

    if (t.mode == "end") {
        b.innerHTML = `
            <div class="big" style="color:var(--ink); font-size:55px; margin-top:20px;">💎</div>
            <div class="tt mid" style="margin-top:10px; font-size:16px;">
                Peti harta karun terbuka!<br>Skor akhir: <b>${t.score}</b>
            </div>
            <p class="mid" style="font-size:12px; margin-top:10px; opacity:0.8;">Kelompok ke-${t.fin} yang selesai. Tunggu kelompok lain ya.</p>
        `;
        $("o" + i).className = "ov";
        return;
    }

    b.innerHTML = `
        <div class="tt-box">
            <div class="tt-title">${v.e} ${v.n}</div>
            <div class="tt-desc">${v.t}</div>
        </div>

        <div class="tg">
            ${v.q.map((q, k) => sv[k]
                ? `<div class="tl dn"><b>${sv[k]}</b><small>soal ${k + 1}</small></div>`
                : `<button type="button" class="tl" onpointerup="handleTileUp(event, ${i}, ${k})" onclick="handleTileClick(event, ${i}, ${k})">${k + 1}</button>`
            ).join("")}
        </div>

        <div class="lk">
            <div class="lk-title">🔐 Gembok Gerbang ${t.lv + 1}</div>
            <div class="lk-clue">Digit dari soal nomor: <b>${v.g.join(", ")}</b></div>
            <div class="sl">${v.g.map(() => "<i>?</i>").join("")}</div>
            <button type="button" class="go" onpointerup="handleLockUp(event, ${i})" onclick="handleLockClick(event, ${i})">Buka Gembok</button>
        </div>
    `;

    b.scrollTop = st;
    attachMultiTouchScroll(b);
}

function kb(i, num) {
    const rows = num
        ? [["1", "2", "3"], ["4", "5", "6"], ["7", "8", "9"]]
        : ["qwertyuiop", "asdfghjkl", "zxcvbnm"].map(s => [...s]);

    let h = rows.map((r, ri) => `
        <div class="kr">
            ${r.map(c => `<button type="button" onpointerdown="pressKey(event, ${i}, '${c}')">${c}</button>`).join("")}
            ${!num && ri == 2 ? `<button type="button" class="w gr" onpointerdown="pressKey(event, ${i}, '<')">⌫</button>` : ""}
        </div>
    `).join("");

    h += num
        ? `<div class="kr">
            <button type="button" class="gr" onpointerdown="pressKey(event, ${i}, 'x')">✖</button>
            <button type="button" onpointerdown="pressKey(event, ${i}, '0')">0</button>
            <button type="button" class="gr" onpointerdown="pressKey(event, ${i}, '<')">⌫</button>
          </div>
          <div class="kr">
            <button type="button" class="w ok" style="max-width:none" onpointerdown="pressKey(event, ${i}, 'ok')">🔓 Buka Gembok</button>
          </div>`
        : `<div class="kr">
            <button type="button" class="w hn" onpointerdown="pressKey(event, ${i}, 'hint')">💡 Hint −5</button>
            <button type="button" class="w gr" onpointerdown="pressKey(event, ${i}, 'x')">✖ Tutup</button>
            ${TE ? `<button type="button" class="w gr" onpointerdown="pressKey(event, ${i}, 'rev')">👁</button>` : ""}
            <button type="button" class="w ok" onpointerdown="pressKey(event, ${i}, 'ok')">✔ Cek</button>
          </div>`;

    return `<div class="kb ${num ? 'np' : ''}">${h}</div>`;
}

function O(i, m, k) {
    const t = T[i], v = L[t.lv];
    t.mode = m;
    t.cur = k;
    t.buf = "";
    const o = $("o" + i);
    o.className = "ov on";

    if (m == "q") {
        const kk = t.lv + "-" + k;
        o.innerHTML = `
            <div class="st">
                <b class="no">📌 Soal ${k + 1}</b>
                <div>${v.q[k][0]}</div>
            </div>
            <div class="fb" id="f${i}">${t.h[kk] ? "💡 Huruf pertama: " + v.q[k][1][0][0].toUpperCase() : ""}</div>
            <div class="ds ph" id="a${i}">ketik jawaban</div>
            ${kb(i, 0)}
        `;
    } else {
        o.innerHTML = `
            <div class="st mid" style="padding-top:6px;">
                <b class="no" style="font-size:14px;">🔐 Gembok Gerbang ${t.lv + 1}</b>
                <div style="font-size:12px; margin-top:2px;">Digit dari soal: <b>${v.g.join(", ")}</b></div>
                <div class="sl sm" id="a${i}" style="justify-content:center; margin-top:8px;"></div>
            </div>
            <div class="fb" id="f${i}"></div>
            ${kb(i, 1)}
        `;
        D(i);
    }

    const stEl = o.querySelector(".st");
    if (stEl) attachMultiTouchScroll(stEl);
}

function D(i) {
    const t = T[i];
    if (t.mode == "lock") {
        $("a" + i).innerHTML = [0, 1, 2, 3].map(n => `<i>${t.buf[n] || "·"}</i>`).join("");
    } else {
        const a = $("a" + i);
        a.textContent = t.buf || "ketik jawaban";
        a.classList.toggle("ph", !t.buf);
    }
}

function F(i, m) {
    const e = $("f" + i);
    if (e) e.textContent = m;
}

function bad(i) {
    beep(150, .25, "sawtooth");
    const o = $("o" + i);
    o.classList.remove("shake");
    void o.offsetWidth;
    o.classList.add("shake");
}

function K(i, c) {
    const t = T[i], v = L[t.lv];
    if (c == "x") { close_(i); return; }
    if (c == "<") { t.buf = t.buf.slice(0, -1); D(i); return; }
    if (c == "hint") {
        const kk = t.lv + "-" + t.cur;
        if (!t.h[kk]) {
            t.h[kk] = 1;
            t.score = Math.max(0, t.score - 5);
            top_();
            $("h" + i).querySelector(".hd-score").textContent = "⭐ " + t.score;
        }
        F(i, "💡 Huruf pertama: " + v.q[t.cur][1][0][0].toUpperCase());
        return;
    }
    if (c == "rev") { F(i, "Jawaban: " + v.q[t.cur][1][0]); return; }
    if (c == "ok") { t.mode == "q" ? chk(i) : lockChk(i); return; }

    if (t.mode == "lock") {
        if (t.buf.length < 4) t.buf += c;
    } else if (t.mode == "q") {
        if (t.buf.length < 16) t.buf += c;
    }

    D(i);
    beep(500 + Math.random() * 100, .04);
}

function pts(i, n) {
    const t = T[i];
    t.score += n;
    $("h" + i).querySelector(".hd-score").textContent = "⭐ " + t.score;
    top_();
}

function chk(i) {
    const t = T[i], q = L[t.lv].q[t.cur], a = norm(t.buf);
    if (!a) return;

    if (q[1].map(norm).includes(a)) {
        const d = q[1][0].length, kk = t.lv + "-" + t.cur, p = t.h[kk] ? 5 : 10;
        t.sv[t.lv][t.cur] = d;
        t.score += p;
        win();
        t.mode = "done";
        $("o" + i).innerHTML = `
            <div class="st mid" style="display:flex; flex-direction:column; justify-content:center;">
                <div style="font-size:16px; color:var(--ok); font-weight:800;">🎉 Benar! +${p} poin</div>
                <div class="big" style="margin: 10px 0;">${d}</div>
                <div style="font-size:13px;">Digit kunci soal ${t.cur + 1} = <b>${d}</b>.<br>Ingat baik-baik untuk gembok!</div>
            </div>
            <div class="kb">
                <div class="kr">
                    <button type="button" class="w ok" style="max-width:none" onpointerdown="pressClose(event, ${i})">Lanjut ➜</button>
                </div>
            </div>
        `;
    } else {
        bad(i);
        F(i, "Belum tepat. Coba lagi atau minta hint!");
        t.buf = "";
        D(i);
    }
}

function lockChk(i) {
    const t = T[i], v = L[t.lv], code = v.g.map(g => v.q[g - 1][1][0].length).join("");
    if (t.buf === code) {
        win();
        t.score += 20;
        t.mode = "open";
        $("o" + i).innerHTML = `
            <div class="st mid" style="display:flex; flex-direction:column; justify-content:center;">
                <div style="font-size:16px; color:var(--ok); font-weight:800;">🔓 Gerbang ${t.lv + 1} Terbuka!</div>
                <div style="font-size:14px; margin-top:4px;">Bonus <b>+20 poin</b></div>
                <div class="big" style="margin: 10px 0; font-size:38px;">${code}</div>
            </div>
            <div class="kb">
                <div class="kr">
                    <button type="button" class="w ok" style="max-width:none" onpointerdown="pressNext(event, ${i})">
                        ${t.lv < 2 ? "Ke Level " + (t.lv + 2) + " ➜" : "Buka Peti Harta 💎"}
                    </button>
                </div>
            </div>
        `;
    } else {
        bad(i);
        F(i, "Kode belum cocok. Cek lagi digit tiap soal!");
        t.buf = "";
        D(i);
    }
}

function nextLv(i) {
    const t = T[i];
    t.h = {};
    if (t.lv < 2) {
        t.lv++;
        t.mode = null;
        $("o" + i).className = "ov";
        R(i);
        $("b" + i).scrollTop = 0;
    } else {
        t.mode = "end";
        t.fin = ++FIN;
        R(i);
    }
}

function close_(i) {
    const t = T[i];
    t.mode = null;
    t.buf = "";
    $("o" + i).className = "ov";
    R(i);
}
</script>
