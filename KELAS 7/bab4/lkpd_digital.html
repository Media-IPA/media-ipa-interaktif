<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKPD Kompetisi Digital - Resultan Gaya</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #0f172a;
            --card: #1e293b;
        }

        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: #f1f5f9; margin: 0; overflow-x: hidden; }

        /* --- SETUP SCREEN --- */
        #setup-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            z-index: 2000; display: flex; align-items: center; justify-content: center;
        }
        .setup-card {
            background: var(--card); padding: 3rem; border-radius: 30px;
            max-width: 600px; width: 90%; text-align: center; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .setup-card h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #60a5fa; }
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 2rem; }
        .mode-btn {
            padding: 1.5rem; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1);
            border-radius: 20px; color: white; font-weight: 700; cursor: pointer; transition: all 0.3s;
        }
        .mode-btn:hover { background: var(--primary); border-color: var(--primary); transform: translateY(-5px); }

        /* --- MAIN LAYOUT --- */
        #competition-arena { display: none; padding: 20px; }
        
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 15px 30px; background: var(--card); border-radius: 20px;
        }

        .arena-grid {
            display: grid; gap: 20px;
            grid-template-columns: repeat(var(--groups), 1fr);
            align-items: start;
        }

        .group-col {
            background: rgba(30, 41, 59, 0.5); border-radius: 24px; padding: 20px;
            border: 2px solid rgba(255,255,255,0.05); transition: all 0.3s;
        }
        .group-col.winner { border-color: var(--success); box-shadow: 0 0 30px rgba(16, 185, 129, 0.2); }

        .group-header {
            text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .group-header h3 { margin: 0; font-size: 1.5rem; color: var(--primary); }

        /* --- TASK CARD --- */
        .task-box {
            background: var(--card); border-radius: 18px; padding: 15px; margin-bottom: 15px;
            position: relative; transition: all 0.4s;
        }
        .task-box.locked { opacity: 0.8; filter: grayscale(0.5); pointer-events: none; }
        .task-box.locked::after {
            content: '\f023   TERKUNCI (BENAR)';
            font-family: 'Font Awesome 6 Free'; font-weight: 900;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(16, 185, 129, 0.9); border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; color: white; letter-spacing: 1px; z-index: 10;
        }

        .task-info { font-size: 0.85rem; margin-bottom: 12px; color: #94a3b8; font-weight: 600; }
        
        .input-row { margin-bottom: 10px; }
        .input-row label { display: block; font-size: 0.75rem; margin-bottom: 5px; opacity: 0.8; }
        input {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155;
            background: #0f172a; color: white; font-family: inherit; font-size: 1rem; box-sizing: border-box;
        }

        .vector-selector {
            display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px;
        }
        .vec-opt {
            padding: 5px; border: 2px solid #334155; border-radius: 8px; cursor: pointer; text-align: center;
            font-weight: 700; background: #0f172a;
        }
        .vec-opt.selected { border-color: var(--primary); background: rgba(59, 130, 246, 0.1); }

        .check-btn {
            width: 100%; margin-top: 15px; padding: 10px; border-radius: 10px; border: none;
            background: var(--primary); color: white; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .check-btn:hover { background: #2563eb; transform: scale(1.02); }

        /* --- NOTIFICATION --- */
        #notif {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 40px; border-radius: 50px; font-weight: 700; z-index: 3000;
            display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* --- IMAGES PREVIEW --- */
        .preview-btn { display: none; }
        .image-modal { display: none; }
    </style>
</head>
<body>

    <!-- SETUP -->
    <div id="setup-screen">
        <div class="setup-card">
            <i class="fa-solid fa-trophy" style="font-size: 4rem; color: #fbbf24; margin-bottom: 1.5rem;"></i>
            <h1>LKPD Arena Kompetisi</h1>
            <p>Pilih jumlah kelompok yang akan bertanding:</p>
            <div class="mode-grid">
                <button class="mode-btn" onclick="initArena(1)">Individu (1)</button>
                <button class="mode-btn" onclick="initArena(2)">2 Kelompok</button>
                <button class="mode-btn" onclick="initArena(3)">3 Kelompok</button>
                <button class="mode-btn" onclick="initArena(4)">4 Kelompok</button>
            </div>
        </div>
    </div>

    <!-- ARENA -->
    <div id="competition-arena">
        <div class="top-bar">
            <div style="font-weight: 800; font-size: 1.2rem; color: var(--primary);">RESULTAN GAYA CHALLENGE</div>
            <div id="timer" style="font-family: monospace; font-size: 1.5rem; background: #000; padding: 5px 15px; border-radius: 10px;">00:00</div>
            <a href="index.html" style="color: white; text-decoration: none; opacity: 0.6;"><i class="fa-solid fa-xmark"></i> Keluar</a>
        </div>

        <div class="arena-grid" id="arena-grid">
            <!-- Columns generated by JS -->
        </div>
    </div>

    <!-- MODAL IMAGES -->
    <div id="image-modal" class="image-modal" onclick="this.style.display='none'">
        <img id="modal-img" src="">
    </div>

    <!-- NOTIF -->
    <div id="notif"></div>

    <script>
        const ANSWERS = {
            task1: { val: 65, vec: 'A' },
            task2: { val: 10, vec: 'C', tim: 'B' },
            task3: { val: 95, vec: 'C', gerak: 'YA' }
        };

        let groupCount = 1;
        let groupProgress = {}; // groupIndex: { tasksCompleted: 0 }

        function initArena(count) {
            groupCount = count;
            document.documentElement.style.setProperty('--groups', count);
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('competition-arena').style.display = 'block';
            
            const grid = document.getElementById('arena-grid');
            grid.innerHTML = '';

            for (let i = 1; i <= count; i++) {
                groupProgress[i] = { completed: 0 };
                grid.innerHTML += createGroupColumn(i);
            }
            
            startTimer();
        }

        function createGroupColumn(idx) {
            return `
            <div class="group-col" id="group-${idx}">
                <div class="group-header">
                    <h3>KELOMPOK ${idx}</h3>
                    <div id="prog-${idx}" style="font-size:0.7rem; color:#94a3b8; margin-top:5px;">PROGRESS: 0/3 SELESAI</div>
                </div>

                <!-- TASK 1 -->
                <div class="task-box" id="g${idx}-t1">
                    <div class="task-info">TUGAS 1: Meja Andi & Budi</div>
                    <div class="input-row">
                        <label>Besar Resultan (N):</label>
                        <input type="number" id="g${idx}-v1">
                    </div>
                    <label style="font-size:0.75rem; opacity:0.8;">Pilih Model Vektor:</label>
                    <div class="vector-selector">
                        <div class="vec-opt" onclick="selectVec(${idx}, 1, 'A', this)">A <i class="fa-solid fa-arrow-right" style="color:#60a5fa; margin:0 5px;"></i> 65 N</div>
                        <div class="vec-opt" onclick="selectVec(${idx}, 1, 'B', this)">B <i class="fa-solid fa-arrow-left" style="color:#f87171; margin:0 5px;"></i> 15 N</div>
                        <div class="vec-opt" onclick="selectVec(${idx}, 1, 'C', this)">C <i class="fa-solid fa-arrow-left" style="color:#f87171; margin:0 5px;"></i> 65 N</div>
                        <div class="vec-opt" onclick="selectVec(${idx}, 1, 'D', this)">D <i class="fa-solid fa-arrow-right" style="color:#60a5fa; margin:0 5px;"></i> 15 N</div>
                    </div>
                    <button class="check-btn" onclick="checkTask(${idx}, 1)">KIRIM JAWABAN</button>
                </div>

                <!-- TASK 2 -->
                <div class="task-box" id="g${idx}-t2">
                    <div class="task-info">TUGAS 2: Tarik Tambang</div>
                    <div class="input-row">
                        <label>Tim Pemenang (A/B):</label>
                        <input type="text" id="g${idx}-tim2" placeholder="A atau B" style="text-transform: uppercase;">
                    </div>
                    <div class="input-row">
                        <label>Besar Resultan (N):</label>
                        <input type="number" id="g${idx}-v2">
                    </div>
                    <label style="font-size:0.75rem; opacity:0.8;">Pilih Model Vektor:</label>
                    <div class="vector-selector">
                        <div class="vec-opt" onclick="selectVec(${idx}, 2, 'A', this)">A <i class="fa-solid fa-arrow-right" style="color:#60a5fa; margin:0 5px;"></i> 160 N</div>
                        <div class="vec-opt" onclick="selectVec(${idx}, 2, 'B', this)">B <i class="fa-solid fa-arrow-left" style="color:#f87171; margin:0 5px;"></i> 10 N</div>
                        <div class="vec-opt" onclick="selectVec(${idx}, 2, 'C', this)">C <i class="fa-solid fa-arrow-right" style="color:#60a5fa; margin:0 5px;"></i> 10 N</div>
                        <div class="vec-opt" onclick="selectVec(${idx}, 2, 'D', this)">D <i class="fa-solid fa-arrow-left" style="color:#f87171; margin:0 5px;"></i> 160 N</div>
                    </div>
                    <button class="check-btn" onclick="checkTask(${idx}, 2)">KIRIM JAWABAN</button>
                </div>

                <!-- TASK 3 -->
                <div class="task-box" id="g${idx}-t3">
                    <div class="task-info">TUGAS 3: Mobil Mogok</div>
                    <div class="input-row">
                        <label>Mobil Bergerak? (Ya/Tidak):</label>
                        <input type="text" id="g${idx}-gerak3" placeholder="Ya atau Tidak" style="text-transform: uppercase;">
                    </div>
                    <div class="input-row">
                        <label>Besar Resultan Akhir (N):</label>
                        <input type="number" id="g${idx}-v3">
                    </div>
                    <label style="font-size:0.75rem; opacity:0.8;">Pilih Model Vektor:</label>
                    <div class="vector-selector">
                        <div class="vec-opt" onclick="selectVec(${idx}, 3, 'A', this)">A <i class="fa-solid fa-arrow-left" style="color:#f87171; margin:0 5px;"></i> 95 N</div>
                        <div class="vec-opt" onclick="selectVec(${idx}, 3, 'B', this)">B <i class="fa-solid fa-arrow-right" style="color:#60a5fa; margin:0 5px;"></i> 335 N</div>
                        <div class="vec-opt" onclick="selectVec(${idx}, 3, 'C', this)">C <i class="fa-solid fa-arrow-right" style="color:#60a5fa; margin:0 5px;"></i> 95 N</div>
                        <div class="vec-opt" onclick="selectVec(${idx}, 3, 'D', this)">D <i class="fa-solid fa-arrow-left" style="color:#f87171; margin:0 5px;"></i> 215 N</div>
                    </div>
                    <button class="check-btn" onclick="checkTask(${idx}, 3)">KIRIM JAWABAN</button>
                </div>
            </div>`;
        }

        let selections = {}; // group-task: choice

        function selectVec(g, t, val, el) {
            const container = el.parentElement;
            container.querySelectorAll('.vec-opt').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
            selections[`g${g}-t${t}`] = val;
        }

        function checkTask(g, t) {
            const valInput = document.getElementById(`g${g}-v${t}`);
            const userVal = parseInt(valInput.value);
            const userVec = selections[`g${g}-t${t}`];

            const correct = ANSWERS[`task${t}`];
            let isCorrect = (userVal === correct.val && userVec === correct.vec);

            if (t === 2) {
                const timInput = document.getElementById(`g${g}-tim2`).value.trim().toUpperCase();
                isCorrect = isCorrect && (timInput === correct.tim);
            }
            if (t === 3) {
                const gerakInput = document.getElementById(`g${g}-gerak3`).value.trim().toUpperCase();
                isCorrect = isCorrect && (gerakInput === correct.gerak);
            }

            if (isCorrect) {
                notify("MANTAP! JAWABAN BENAR", "success");
                lockTask(g, t);
                groupProgress[g].completed++;
                document.getElementById(`prog-${g}`).innerText = `PROGRESS: ${groupProgress[g].completed}/3 SELESAI`;
                
                if (groupProgress[g].completed === 3) {
                    markWinner(g);
                }
            } else {
                notify("UPS! MASIH SALAH, COBA LAGI", "danger");
                shake(document.getElementById(`g${g}-t${t}`));
            }
        }

        function lockTask(g, t) {
            const box = document.getElementById(`g${g}-t${t}`);
            box.classList.add('locked');
            // Hide input values for anti-cheat
            const input = document.getElementById(`g${g}-v${t}`);
            input.type = "password";
            input.value = "****";
            
            if (t === 2) {
                const timInput = document.getElementById(`g${g}-tim2`);
                timInput.type = "password"; timInput.value = "****";
            }
            if (t === 3) {
                const gerakInput = document.getElementById(`g${g}-gerak3`);
                gerakInput.type = "password"; gerakInput.value = "****";
            }
        }

        function notify(msg, type) {
            const el = document.getElementById('notif');
            el.innerText = msg;
            el.style.display = 'block';
            el.style.background = type === 'success' ? 'var(--success)' : 'var(--danger)';
            setTimeout(() => el.style.display = 'none', 2000);
        }

        function shake(el) {
            el.style.transform = 'translateX(10px)';
            setTimeout(() => el.style.transform = 'translateX(-10px)', 100);
            setTimeout(() => el.style.transform = 'translateX(0)', 200);
        }

        function showImage(src) {
            document.getElementById('modal-img').src = src;
            document.getElementById('image-modal').style.display = 'flex';
        }

        function markWinner(g) {
            const col = document.getElementById(`group-${g}`);
            col.classList.add('winner');
            col.innerHTML = `<div style="text-align:center; padding:100px 0;">
                <i class="fa-solid fa-crown" style="font-size:5rem; color:#fbbf24; margin-bottom:20px;"></i>
                <h2 style="color:var(--success)">FINISH!</h2>
                <p>Kelompok ${g} Selesai di Waktu: ${document.getElementById('timer').innerText}</p>
            </div>` + col.innerHTML;
        }

        let seconds = 0;
        function startTimer() {
            setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                document.getElementById('timer').innerText = 
                    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }
    </script>
</body>
</html>
