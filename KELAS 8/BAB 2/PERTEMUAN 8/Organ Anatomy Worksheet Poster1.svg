<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 860" width="960" height="860">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="kulitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="paruGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="hatiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="ginjalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="860" fill="url(#bgGrad)"/>

  <!-- Top Title Banner -->
  <rect x="24" y="16" width="912" height="48" rx="12" fill="#1e293b"/>
  <text x="480" y="46" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">
    LKPD 1 • POSTER ANATOMI 4 ORGAN EKSKRESI MANUSIA
  </text>

  <!-- ================= 1. KULIT (TOP LEFT) ================= -->
  <rect x="24" y="74" width="446" height="366" rx="16" fill="url(#kulitGrad)" stroke="#f43f5e" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="36" y="86" width="160" height="30" rx="8" fill="#f43f5e"/>
  <text x="116" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1. KULIT (INTEGUMEN)</text>

  <!-- Kulit Illustration -->
  <g transform="translate(44, 126)">
    <!-- Epidermis Layer -->
    <rect x="0" y="0" width="220" height="35" rx="6" fill="#fb7185" opacity="0.9"/>
    <text x="110" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Lapisan Luar (Epidermis)</text>
    
    <!-- Dermis Layer -->
    <rect x="0" y="38" width="220" height="120" rx="6" fill="#fda4af" opacity="0.8"/>
    <text x="110" y="60" font-family="sans-serif" font-size="11" font-weight="bold" fill="#881337" text-anchor="middle">Lapisan Jangat (Dermis)</text>

    <!-- Kelenjar Keringat & Saluran -->
    <path d="M 60 70 Q 75 110 90 140 Q 100 150 110 140 Q 115 125 105 115 Q 95 110 85 125 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <circle cx="95" cy="130" r="14" fill="#0284c7" opacity="0.6"/>

    <!-- Pembuluh Darah -->
    <path d="M 140 70 C 135 100 160 120 155 150" stroke="#ef4444" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 148 70 C 143 100 168 120 163 150" stroke="#3b82f6" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Hypodermis / Jaringan Lemak -->
    <rect x="0" y="162" width="220" height="80" rx="6" fill="#fde047" opacity="0.85"/>
    <text x="110" y="195" font-family="sans-serif" font-size="11" font-weight="bold" fill="#854d0e" text-anchor="middle">Jaringan Lemak Bawah Kulit</text>
    <circle cx="40" cy="215" r="12" fill="#eab308" opacity="0.5"/>
    <circle cx="70" cy="215" r="12" fill="#eab308" opacity="0.5"/>
    <circle cx="100" cy="215" r="12" fill="#eab308" opacity="0.5"/>
    <circle cx="130" cy="215" r="12" fill="#eab308" opacity="0.5"/>
    <circle cx="160" cy="215" r="12" fill="#eab308" opacity="0.5"/>
    <circle cx="190" cy="215" r="12" fill="#eab308" opacity="0.5"/>
  </g>

  <!-- Kulit Guide Lines -->
  <path d="M 264 142 L 340 60" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 264 185 L 345 150" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 148 250 L 345 236" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 205 270 L 345 326" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 264 330 L 325 400" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,4"/>


  <!-- ================= 2. PARU-PARU (TOP RIGHT) ================= -->
  <rect x="490" y="74" width="446" height="366" rx="16" fill="url(#paruGrad)" stroke="#10b981" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="502" y="86" width="180" height="30" rx="8" fill="#10b981"/>
  <text x="592" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2. PARU-PARU (PULMO)</text>

  <!-- Paru-paru Illustration -->
  <g transform="translate(620, 115)">
    <!-- Trakea (Batang Tenggorok) -->
    <rect x="65" y="0" width="30" height="70" rx="5" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <line x1="65" y1="15" x2="95" y2="15" stroke="#94a3b8" stroke-width="2"/>
    <line x1="65" y1="30" x2="95" y2="30" stroke="#94a3b8" stroke-width="2"/>
    <line x1="65" y1="45" x2="95" y2="45" stroke="#94a3b8" stroke-width="2"/>

    <!-- Bronkus Cabang -->
    <path d="M 80 70 L 45 105" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <path d="M 80 70 L 115 105" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

    <!-- Paru Kanan (Tampak Kiri Pengamat) -->
    <path d="M 40 100 C 10 110 -20 160 -10 220 C 0 250 35 255 55 245 C 70 235 60 180 40 100 Z" fill="#f472b6" opacity="0.85" stroke="#db2777" stroke-width="2"/>
    
    <!-- Paru Kiri (Tampak Kanan Pengamat) -->
    <path d="M 120 100 C 150 110 180 160 170 220 C 160 250 125 255 105 245 C 90 235 100 180 120 100 Z" fill="#f472b6" opacity="0.85" stroke="#db2777" stroke-width="2"/>

    <!-- Alveolus Cluster -->
    <g transform="translate(180, 150)">
      <circle cx="20" cy="15" r="9" fill="#fda4af" stroke="#e11d48"/>
      <circle cx="34" cy="12" r="8" fill="#fda4af" stroke="#e11d48"/>
      <circle cx="26" cy="26" r="8" fill="#fda4af" stroke="#e11d48"/>
      <circle cx="12" cy="24" r="7" fill="#fda4af" stroke="#e11d48"/>
    </g>
  </g>

  <!-- Paru Guide Lines -->
  <path d="M 715 130 L 790 73" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 725 200 L 820 156" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 825 285 L 835 258" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 760 290 L 835 382" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 645 280 L 590 310" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>


  <!-- ================= 3. HATI (BOTTOM LEFT) ================= -->
  <rect x="24" y="456" width="446" height="388" rx="16" fill="url(#hatiGrad)" stroke="#d97706" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="36" y="468" width="160" height="30" rx="8" fill="#d97706"/>
  <text x="116" y="488" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">3. HATI (HEPAR)</text>

  <!-- Hati Illustration -->
  <g transform="translate(60, 520)">
    <!-- Lobus Kanan & Kiri Hati -->
    <path d="M 80 40 C 160 10 280 30 320 90 C 340 140 280 210 200 210 C 140 210 50 190 30 140 C 20 100 40 50 80 40 Z" fill="#991b1b" opacity="0.9" stroke="#7f1d1d" stroke-width="3"/>

    <!-- Garis Pemisah Lobus -->
    <path d="M 200 50 Q 195 120 190 195" stroke="#fca5a5" stroke-width="3" stroke-dasharray="5,5"/>

    <!-- Kantung Empedu (Gallbladder) -->
    <path d="M 130 160 C 120 180 110 210 130 225 C 150 235 165 210 155 180 Z" fill="#65a30d" stroke="#3f6212" stroke-width="2.5"/>
    <text x="140" y="210" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Empedu</text>

    <!-- Pembuluh Vena Cava / Porta -->
    <path d="M 215 150 C 220 170 230 190 235 220" stroke="#3b82f6" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 230 155 C 235 175 245 195 250 220" stroke="#ef4444" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Hati Guide Lines -->
  <path d="M 170 610 L 210 520" stroke="#b45309" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 320 620 L 360 546" stroke="#b45309" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 190 735 L 125 815" stroke="#b45309" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 290 735 L 360 793" stroke="#b45309" stroke-width="2" stroke-dasharray="4,4"/>


  <!-- ================= 4. GINJAL (BOTTOM RIGHT) ================= -->
  <rect x="490" y="456" width="446" height="388" rx="16" fill="url(#ginjalGrad)" stroke="#7c3aed" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="502" y="468" width="160" height="30" rx="8" fill="#7c3aed"/>
  <text x="582" y="488" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">4. GINJAL (REN)</text>

  <!-- Ginjal Cross Section Illustration -->
  <g transform="translate(630, 520)">
    <!-- Ginjal Exterior (Bean shape) -->
    <path d="M 80 20 C 140 20 180 70 180 130 C 180 200 130 250 80 250 C 40 250 15 210 15 170 C 15 140 35 130 35 110 C 35 90 20 80 20 60 C 20 30 45 20 80 20 Z" fill="#831843" stroke="#500724" stroke-width="3"/>

    <!-- Korteks (Outer Rim) -->
    <path d="M 80 32 C 130 32 165 75 165 130 C 165 190 120 238 80 238 C 45 238 27 205 27 170 C 27 135 45 125 45 110 C 45 95 32 85 32 60 C 32 40 50 32 80 32 Z" fill="#be185d" opacity="0.8"/>

    <!-- Medula (Piramida Ginjal) -->
    <path d="M 115 80 L 140 70 L 135 100 Z" fill="#f43f5e"/>
    <path d="M 125 115 L 150 110 L 145 140 Z" fill="#f43f5e"/>
    <path d="M 120 150 L 145 155 L 135 185 Z" fill="#f43f5e"/>
    <path d="M 100 185 L 125 200 L 110 220 Z" fill="#f43f5e"/>

    <!-- Pelvis Renalis (Rongga Putih) -->
    <path d="M 45 105 C 75 100 95 115 95 135 C 95 155 75 170 45 165 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>

    <!-- Pembuluh Arteri (Merah) & Vena (Biru) -->
    <path d="M 2 120 L 50 125" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
    <path d="M 2 145 L 50 140" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>

    <!-- Saluran Ureter (Kuning) -->
    <path d="M 50 158 C 45 190 50 230 60 270" stroke="#eab308" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 50 158 C 45 190 50 230 60 270" stroke="#ca8a04" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Ginjal Guide Lines -->
  <path d="M 785 570 L 805 498" stroke="#6d28d9" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 760 635 L 815 572" stroke="#6d28d9" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 710 655 L 815 654" stroke="#6d28d9" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 645 640 L 610 645" stroke="#6d28d9" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 645 668 L 575 735" stroke="#6d28d9" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 690 780 L 800 826" stroke="#6d28d9" stroke-width="2" stroke-dasharray="4,4"/>

</svg>