<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1420" width="960" height="1420">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="p2Shadow" x="-3%" y="-2%" width="106%" height="106%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="1420" fill="url(#p2Bg)"/>

  <!-- Top Title Banner -->
  <rect x="24" y="20" width="912" height="74" rx="14" fill="#1e1b4b"/>
  <text x="480" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">
    LEMBAR KERJA PESERTA DIDIK (LKPD) DIGITAL
  </text>
  <text x="480" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#a5b4fc" text-anchor="middle">
    IPA KELAS VIII • BAB 2: SISTEM EKSKRESI PADA MANUSIA
  </text>

  <!-- Identity Row -->
  <rect x="24" y="106" width="912" height="46" rx="10" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="40" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#312e81">
    Nama Kelompok / Siswa: ______________________
  </text>
  <text x="440" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#312e81">
    Kelas: VIII ___
  </text>
  <text x="680" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#312e81">
    Tanggal: _______________
  </text>


  <!-- ================= SECTION 1: ISIAN SINGKAT (LEFT COLUMN TOP) ================= -->
  <!-- Box around Section 1 -->
  <rect x="24" y="165" width="490" height="375" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2" filter="url(#p2Shadow)"/>
  <rect x="36" y="177" width="220" height="28" rx="7" fill="#4f46e5"/>
  <text x="146" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">BAGIAN 1: ISIAN SINGKAT</text>
  <text x="36" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748b">Klik kotak titik-titik untuk mengetik jawaban menggunakan papan ketik:</text>

  <!-- Soal 1 -->
  <!-- top: 26.2% of 1420 = 372px -->
  <text x="36" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">1. Organ penyaring darah utama:</text>
  <text x="36" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#334155">
    Organ ekskresi utama penyaring darah adalah
  </text>
  <text x="360" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#334155">.</text>

  <!-- Soal 2 -->
  <!-- top: 31.2% of 1420 = 443px -->
  <text x="36" y="446" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#334155">
    2. Keringat kulit mengandung:
  </text>
  <text x="450" y="446" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#334155">.</text>

  <!-- Soal 3 -->
  <!-- top: 36.2% of 1420 = 514px -->
  <text x="36" y="517" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#334155">
    3. Gas CO2 dan uap air dikeluarkan oleh
  </text>
  <text x="360" y="517" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#334155">.</text>

  <!-- Soal 4 -->
  <!-- top: 41.2% of 1420 = 585px -->
  <text x="36" y="588" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#334155">
    4. Zat empedu hati:
  </text>
  <text x="315" y="588" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#334155">
    merombak sel darah merah.
  </text>

  <!-- Soal 5 -->
  <!-- top: 46.2% of 1420 = 656px -->
  <text x="36" y="659" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#334155">
    5. Saluran urine: Saluran
  </text>
  <text x="330" y="659" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#334155">
    menuju kandung kemih.
  </text>


  <!-- ================= SECTION 2: BENAR ATAU SALAH (LEFT COLUMN BOTTOM) ================= -->
  <!-- Box around Section 2 -->
  <rect x="24" y="556" width="490" height="840" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#p2Shadow)"/>
  <rect x="36" y="570" width="250" height="28" rx="7" fill="#059669"/>
  <text x="161" y="589" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">BAGIAN 2: BENAR ATAU SALAH</text>
  <text x="36" y="616" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748b">Seret chip Benar (B) / Salah (S) atau klik kotak pilihan pada nomor berikut:</text>

  <!-- Header Tabel B / S -->
  <rect x="36" y="632" width="370" height="26" rx="5" fill="#f1f5f9"/>
  <text x="46" y="649" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#475569">Pernyataan Soal</text>
  <rect x="415" y="632" width="75" height="26" rx="5" fill="#d1fae5"/>
  <text x="452" y="649" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#065f46" text-anchor="middle">Jawaban</text>

  <!-- Pernyataan 1: top: 59.8% = 849px -->
  <rect x="36" y="825" width="370" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="845" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#1e293b">1. Ginjal menyaring darah kotor</text>
  <text x="44" y="862" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">dan membuang sisa metabolisme berupa urine.</text>

  <!-- Pernyataan 2: top: 65.0% = 923px -->
  <rect x="36" y="900" width="370" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="920" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#1e293b">2. Hati mengeluarkan gas O2</text>
  <text x="44" y="937" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">sebagai zat sisa metabolisme ke luar tubuh.</text>

  <!-- Pernyataan 3: top: 69.8% = 991px -->
  <rect x="36" y="968" width="370" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="988" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#1e293b">3. Kelenjar keringat pada kulit</text>
  <text x="44" y="1005" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">berfungsi menurunkan suhu tubuh saat panas.</text>

  <!-- Pernyataan 4: top: 74.6% = 1059px -->
  <rect x="36" y="1036" width="370" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="1056" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#1e293b">4. Paru-paru membuang gas CO2</text>
  <text x="44" y="1073" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">dan uap air dari hasil pernapasan seluler.</text>

  <!-- Pernyataan 5: top: 79.5% = 1129px -->
  <rect x="36" y="1105" width="370" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="1125" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#1e293b">5. Zat warna bilirubin</text>
  <text x="44" y="1142" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">memberi warna khas pada urine dan feses.</text>


  <!-- ================= SECTION 3: MENJODOHKAN (RIGHT COLUMN) ================= -->
  <!-- Box around Section 3 -->
  <rect x="526" y="165" width="410" height="1231" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#p2Shadow)"/>
  <rect x="538" y="177" width="220" height="28" rx="7" fill="#d97706"/>
  <text x="648" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">BAGIAN 3: MENJODOHKAN</text>
  <text x="538" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748b">Tarik garis dari titik kiri (1-5) ke titik kanan (A-E):</text>

  <!-- Headers -->
  <rect x="538" y="240" width="180" height="24" rx="5" fill="#fef3c7"/>
  <text x="628" y="256" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#92400e" text-anchor="middle">Organ / Struktur</text>
  
  <rect x="790" y="240" width="135" height="24" rx="5" fill="#fed7aa"/>
  <text x="857" y="256" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="middle">Fungsi Utama</text>

  <!-- Dot 1: Kulit: top: 31.4% = 446px -->
  <rect x="538" y="420" width="180" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="548" y="442" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#1e293b">1. Kulit Tubuh</text>
  <text x="548" y="458" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">Organ terluar tubuh</text>

  <!-- Dot 2: Ginjal: top: 45.0% = 639px -->
  <rect x="538" y="613" width="180" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="548" y="635" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#1e293b">2. Ginjal (Ren)</text>
  <text x="548" y="651" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">Penyaring darah</text>

  <!-- Dot 3: Hati: top: 58.2% = 826px -->
  <rect x="538" y="800" width="180" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="548" y="822" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#1e293b">3. Hati (Hepar)</text>
  <text x="548" y="838" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">Kelenjar terbesar</text>

  <!-- Dot 4: Paru-paru: top: 72.4% = 1028px -->
  <rect x="538" y="1002" width="180" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="548" y="1024" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#1e293b">4. Paru-Paru</text>
  <text x="548" y="1040" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">Organ respirasi</text>

  <!-- Dot 5: Ureter: top: 84.4% = 1198px -->
  <rect x="538" y="1172" width="180" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="548" y="1194" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#1e293b">5. Saluran Ureter</text>
  <text x="548" y="1210" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">Saluran urinaria</text>


  <!-- RIGHT TARGETS (A to E) -->
  <!-- Target A: Hati (top: 31.4% = 446px) -->
  <rect x="795" y="420" width="130" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="805" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#b45309">A. Hati</text>
  <text x="805" y="456" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#64748b">Perombak eritrosit</text>

  <!-- Target B: Ginjal (top: 44.8% = 636px) -->
  <rect x="795" y="613" width="130" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="805" y="440" transform="translate(0, 193)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#0284c7">B. Ginjal</text>
  <text x="805" y="456" transform="translate(0, 193)" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#64748b">Penyaring darah</text>

  <!-- Target C: Ureter (top: 57.0% = 809px) -->
  <rect x="795" y="783" width="130" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="805" y="440" transform="translate(0, 363)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#7c3aed">C. Ureter</text>
  <text x="805" y="456" transform="translate(0, 363)" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#64748b">Saluran ke kemih</text>

  <!-- Target D: Kulit (top: 71.0% = 1008px) -->
  <rect x="795" y="982" width="130" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="805" y="440" transform="translate(0, 562)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#e11d48">D. Kulit</text>
  <text x="805" y="456" transform="translate(0, 562)" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#64748b">Keringat & suhu</text>

  <!-- Target E: Paru-paru (top: 84.4% = 1198px) -->
  <rect x="795" y="1172" width="130" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="805" y="440" transform="translate(0, 752)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#059669">E. Paru-Paru</text>
  <text x="805" y="456" transform="translate(0, 752)" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#64748b">CO2 & uap air</text>

</svg>