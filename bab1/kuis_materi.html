<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balapan Kuis Multiplayer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-blue: #0284c7;
            --neon-purple: #7e22ce;
            --neon-green: #16a34a;
            --neon-orange: #ea580c;
            --neon-pink: #db2777;
            --bg-color: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-color);
            color: #1e293b;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            background: linear-gradient(135deg, #7e22ce, #db2777);
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .top-bar h1 {
            margin: 0;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-control {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-control:hover { background: rgba(255,255,255,0.4); }

        /* Setup Screen */
        #setup-screen {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .setup-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            color: white;
            max-width: 600px;
        }
        .setup-card h2 { font-size: 2rem; margin-top: 0; margin-bottom: 5px; color: #38bdf8; }
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        .mode-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid #38bdf8;
            color: white;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .mode-btn:hover { background: rgba(56, 189, 248, 0.2); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(56,189,248,0.2); }
        .mode-btn i { font-size: 2rem; margin-bottom: 10px; display: block; color: #38bdf8; }

        /* Game Screen */
        #game-screen {
            display: none;
            height: calc(100vh - 60px);
            width: 100vw;
        }
        
        /* Grid Layouts */
        .layout-1 { display: grid; grid-template-columns: 1fr; height: 100%; }
        .layout-2 { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
        .layout-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; height: 100%; }
        .layout-4 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; height: 100%; }

        .player-panel {
            border: 2px solid #e2e8f0;
            background: white;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Color Code per Player */
        .player-panel[data-p="1"] { border-top: 5px solid var(--neon-blue); }
        .player-panel[data-p="2"] { border-top: 5px solid var(--neon-orange); }
        .player-panel[data-p="3"] { border-top: 5px solid var(--neon-purple); }
        .player-panel[data-p="4"] { border-top: 5px solid var(--neon-pink); }
        
        .p-text-color-1 { color: var(--neon-blue); }
        .p-text-color-2 { color: var(--neon-orange); }
        .p-text-color-3 { color: var(--neon-purple); }
        .p-text-color-4 { color: var(--neon-pink); }

        .panel-header {
            padding: 10px 15px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .score-badge {
            background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; padding: 4px 10px; border-radius: 50px; font-size: 0.9rem;
        }

        .panel-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        .question-badge {
            display: inline-block; background: #e0f2fe; color: #0284c7; padding: 5px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.1rem; font-weight: 500; margin-bottom: 15px; color: #1e293b; line-height: 1.5;
        }

        /* Success Transisition Overlay */
        .finish-overlay {
            position: absolute; inset: 0; background: rgba(255,255,255,0.95); z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .finish-overlay.show { opacity: 1; pointer-events: auto; }
        .finish-overlay h3 { font-size: 2.5rem; color: var(--neon-green); margin: 0; }
        .finish-overlay p { font-size: 1.2rem; color: #475569; font-weight: 600; }

        /* Generic Button */
        .btn-action {
            background: var(--neon-blue); color: white; border: none; padding: 12px 20px;
            border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 15px; width: 100%; box-shadow: 0 4px 6px rgba(2, 132, 199, 0.2);
        }
        .btn-action:hover { background: #0369a1; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(2, 132, 199, 0.3); }

        /* PG Options */
        .pg-opt {
            display: block; padding: 12px 15px; margin-bottom: 8px; background: #f1f5f9;
            border-radius: 8px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s; user-select: none;
            position: relative; padding-left: 45px; font-size: 0.95rem; color: #334155;
        }
        .pg-opt input {
            position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0;
        }
        .pg-opt::before {
            content: ''; position: absolute; left: 15px; top: 12px; width: 18px; height: 18px;
            border: 2px solid #94a3b8; border-radius: 4px; transition: 0.2s;
        }
        .pg-opt:hover { background: #e2e8f0; }
        .pg-opt:has(input:checked) { background: rgba(2, 132, 199, 0.1); border-color: var(--neon-blue); }
        .pg-opt:has(input:checked)::before { background: var(--neon-blue); border-color: var(--neon-blue); }
        .pg-opt:has(input:checked)::after {
            content: '✓'; position: absolute; left: 18px; top: 11px; color: white; font-weight: bold; font-size: 14px;
        }
        
        /* Matching */
        .match-grid { display: flex; gap: 10px; }
        .match-col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .m-item {
            padding: 10px; background: white; border: 2px solid #cbd5e1; border-radius: 8px; text-align: center;
            cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: 0.2s; user-select: none; color: #475569;
        }
        .m-left { border-left: 4px solid var(--neon-blue); }
        .m-right { border-right: 4px solid var(--neon-orange); }
        .m-item.selected { background: #e0f2fe; border-color: var(--neon-blue); transform: scale(1.02); color: var(--neon-blue); }
        .m-item.matched { background: #dcfce7; border-color: var(--neon-green); color: #166534; pointer-events: none; opacity: 0.8; }
        .m-item.error { background: #fee2e2; border-color: #ef4444; color: #991b1b; }

        /* Crossword */
        .cw-container { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%;}
        .cw-clues { font-size: 0.85rem; margin-bottom: 10px; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; width: 100%; box-sizing: border-box; line-height: 1.5; color: #475569;}
        .cw-grid {
            display: grid; grid-template-columns: repeat(12, 25px); grid-template-rows: repeat(11, 25px);
            gap: 1px; background: #cbd5e1; padding: 5px; border-radius: 8px; max-width: 100%; overflow: auto;
        }
        .cw-cell { background: transparent; width: 100%; height: 100%; position: relative; }
        .cw-input {
            width: 100%; height: 100%; background: white; border: none; text-align: center; text-transform: uppercase;
            font-weight: bold; font-family: monospace; outline: none; padding: 0; transition: 0.2s; color: #0f172a;
        }
        .cw-input:focus { background: #bae6fd; }
        .cw-input.correct { background: #bbf7d0; color: #166534; }
        .cw-num { position: absolute; top: 0; left: 1px; font-size: 8px; font-weight: bold; pointer-events: none; z-index: 10; color: #64748b; }
        
        /* Feedback Toast */
        .feedback-toast {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 8px 16px; border-radius: 50px; color: white; font-weight: bold; font-size: 0.85rem;
            opacity: 0; transition: 0.3s; pointer-events: none; z-index: 20; box-shadow: 0 4px 10px rgba(0,0,0,0.2); white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- Setup Screen -->
    <div id="setup-screen">
        <div class="setup-card">
            <h2><i class="fa-solid fa-bolt" style="color: #fcd34d;"></i> Kuis Balapan (Cepat-cepatan)</h2>
            <p style="opacity: 0.9; margin-bottom: 20px;">Tantangan didesain acak (random) untuk setiap layar kelompok. Siapa yang berhasil menuntaskan semua tantangan lebih dulu, dialah Juaranya!</p>
            
            <div class="mode-grid">
                <button class="mode-btn" onclick="startGame(1)">
                    <i class="fa-solid fa-user"></i> Individu
                </button>
                <button class="mode-btn" onclick="startGame(2)">
                    <i class="fa-solid fa-handshake"></i> 2 Kelompok
                </button>
                <button class="mode-btn" onclick="startGame(3)">
                    <i class="fa-solid fa-users"></i> 3 Kelompok
                </button>
                <button class="mode-btn" onclick="startGame(4)">
                    <i class="fa-solid fa-users-viewfinder"></i> 4 Kelompok
                </button>
            </div>
        </div>
    </div>

    <!-- Top Bar Control -->
    <div class="top-bar" id="top-bar" style="display:none;">
        <h1 id="global-title"><i class="fa-solid fa-flag-checkered"></i> Balapan Kuis Besaran & Pengukuran</h1>
        <button class="btn-control" onclick="resetGame()"><i class="fa-solid fa-power-off"></i> Akhiri Balapan</button>
    </div>

    <!-- Split Screen Container -->
    <div id="game-screen">
        <!-- Rendered by JS -->
    </div>

<script>
    // --- Data Base Soal ---
    const stagesDB = [
        {
            type: 'pg', tag: 'PILIHAN GANDA', 
            text: 'Pilih semua besaran di bawah yang merupakan <b>Besaran Pokok</b> dan pasangannya dalam SI!',
            options: [
                { id: '1a', text: 'Massa - Gram (g)', isCorrect: false },
                { id: '1b', text: 'Panjang - Meter (m)', isCorrect: true },
                { id: '1c', text: 'Kuat Arus - Ampere (A)', isCorrect: true },
                { id: '1d', text: 'Suhu - Celcius (°C)', isCorrect: false },
                { id: '1e', text: 'Waktu - Sekon (s)', isCorrect: true }
            ]
        },
        {
            type: 'pg', tag: 'PILIHAN GANDA', 
            text: 'Pilih semua alat ukur yang memiliki tingkat ketelitian <b>≤ 0.1 mm</b>!',
            options: [
                { id: '2a', text: 'Mistar / Penggaris Biasa', isCorrect: false },
                { id: '2b', text: 'Jangka Sorong', isCorrect: true },
                { id: '2c', text: 'Mikrometer Sekrup', isCorrect: true },
                { id: '2d', text: 'Neraca Ohaus', isCorrect: false }
            ]
        },
        {
            type: 'pg', tag: 'PILIHAN GANDA', 
            text: 'Apa saja yang secara sah tercantum ke dalam daftar <b>BESARAN TURUNAN</b>?',
            options: [
                { id: '3a', text: 'Luas & Volume', isCorrect: true },
                { id: '3b', text: 'Massa Jenis & Kecepatan', isCorrect: true },
                { id: '3c', text: 'Suhu & Kuat Arus', isCorrect: false },
                { id: '3d', text: 'Waktu & Panjang', isCorrect: false }
            ]
        },
        {
            type: 'pg', tag: 'PILIHAN GANDA', 
            text: 'Manakah yang merupakan wujud implementasi pengukuran <b>Satuan Baku Internasional (SI)</b>?',
            options: [
                { id: '4a', text: 'Hasta & Depa', isCorrect: false },
                { id: '4b', text: 'Meter & Kelvin', isCorrect: true },
                { id: '4c', text: 'Kilogram & Ampere', isCorrect: true },
                { id: '4d', text: 'Jengkal & Langkah', isCorrect: false }
            ]
        },
        {
            type: 'pg', tag: 'PILIHAN GANDA', 
            text: 'Pilih alat bantu ukur yang <b>Paling Tepat</b> untuk mengukur "Massa"!',
            options: [
                { id: '5a', text: 'Stopwatch Digital', isCorrect: false },
                { id: '5b', text: 'Neraca Lengan', isCorrect: true },
                { id: '5c', text: 'Gelas Ukur Berskala', isCorrect: false },
                { id: '5d', text: 'Neraca Digital', isCorrect: true }
            ]
        },
        {
            type: 'match', tag: 'MENJODOHKAN', 
            text: 'Klik secara berpasangan antara kolom Kiri (Biru) dan Kanan (Oranye)!',
            pairs: [
                { q: 'Mengukur diameter dalam', a: 'Jangka Sorong', id: 'm1' },
                { q: 'Ketelitian alat 0,01 mm', a: 'Mikrometer Sekrup', id: 'm2' },
                { q: 'Kombinasi besaran pokok', a: 'Besaran Turunan', id: 'm3' },
                { q: 'Contoh non-baku', a: 'Jengkal & Hasta', id: 'm4' }
            ]
        },
        {
            type: 'crossword', tag: 'TEKA-TEKI SILANG', 
            text: 'Ketik satu huruf di tiap kotak dengan benar!',
            clues: '<b>Mendatar:</b> 1. Satuan SI Massa | 3. Alat ukur waktu <br><b>Menurun:</b> 2. Sesuatu yang terukur angka | 4. Luas, Volume, dst (Besaran...)'
        }
    ];

    const cwMap = [
        {y:1, x:1, c:'K', n:1}, {y:1, x:2, c:'I'}, {y:1, x:3, c:'L'}, {y:1, x:4, c:'O'}, {y:1, x:5, c:'G'}, {y:1, x:6, c:'R'}, {y:1, x:7, c:'A'}, {y:1, x:8, c:'M'},
        {y:3, x:0, c:'B', n:2}, {y:4, x:0, c:'E'}, {y:5, x:0, c:'S'}, {y:6, x:0, c:'A'}, {y:7, x:0, c:'R'}, {y:8, x:0, c:'A'}, {y:9, x:0, c:'N'},
        {y:5, x:2, c:'S', n:3}, {y:5, x:3, c:'T'}, {y:5, x:4, c:'O'}, {y:5, x:5, c:'P'}, {y:5, x:6, c:'W'}, {y:5, x:7, c:'A'}, {y:5, x:8, c:'T'}, {y:5, x:9, c:'C'}, {y:5, x:10, c:'H'},
        {y:1, x:11, c:'T', n:4}, {y:2, x:11, c:'U'}, {y:3, x:11, c:'R'}, {y:4, x:11, c:'U'}, {y:5, x:11, c:'N'}, {y:6, x:11, c:'A'}, {y:7, x:11, c:'N'}
    ];

    // --- State Control (Independent per Player) ---
    let numPlayers = 1;
    let finishRank = 1;
    let playerScores = {};
    let playerStageIndex = {};
    let playerSequence = {};

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function startGame(players) {
        numPlayers = players;
        finishRank = 1;
        
        let gameScreen = document.getElementById('game-screen');
        gameScreen.innerHTML = '';
        gameScreen.className = 'layout-' + players;
        gameScreen.style.display = 'grid';
        
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('top-bar').style.display = 'flex';
        
        // Generate independent UI and shuffle sequences
        let baseIndices = [0, 1, 2, 3, 4, 5, 6];
        for (let p = 1; p <= numPlayers; p++) {
            playerScores[p] = 0;
            playerStageIndex[p] = 0;
            playerSequence[p] = shuffleArray(baseIndices); // EACH GROUP GETS UNIQUE ORDER
            
            let panel = document.createElement('div');
            panel.className = 'player-panel';
            panel.id = `panel-p${p}`;
            panel.setAttribute('data-p', p);
            gameScreen.appendChild(panel);
            
            renderPlayerStage(p);
        }
    }

    function resetGame() {
        document.getElementById('setup-screen').style.display = 'flex';
        document.getElementById('top-bar').style.display = 'none';
        document.getElementById('game-screen').style.display = 'none';
    }

    // Single logic render per player
    function renderPlayerStage(p) {
        let panel = document.getElementById(`panel-p${p}`);
        
        // Cek jika Player berhasil selesaikan semua urutan soal
        if (playerStageIndex[p] >= stagesDB.length) {
            // Kalkulasi skor juara
            let rankPoints = numPlayers === 1 ? 100 : (100 - ((finishRank-1)*20)); 
            if (rankPoints < 40) rankPoints = 40;
            playerScores[p] += rankPoints;
            
            let badgeTitle = numPlayers > 1 ? `JUARA ${finishRank}` : `SUKSES!`;
            let trophyColor = finishRank === 1 ? '#fcd34d' : (finishRank === 2 ? '#94a3b8' : '#cd7f32');
            
            panel.innerHTML = `
                <div class="panel-header">
                    <span class="p-text-color-${p}">Kelompok ${p}</span>
                </div>
                <div class="finish-overlay show" style="background:#f8fafc; z-index:50;">
                    <i class="fa-solid fa-trophy" style="font-size: 5rem; color:${trophyColor}; margin-bottom: 20px;"></i>
                    <h3 style="font-size:3rem; color:var(--neon-green); margin-bottom:10px;">${badgeTitle}</h3>
                    <p style="margin:0 0 20px;">Semua tantangan tuntas dikerjakan.</p>
                    <div class="score-badge" style="font-size:1.5rem; padding: 10px 30px;">Total Skor: ${playerScores[p]}</div>
                </div>
            `;
            finishRank++;
            return;
        }
        
        // Ambil Data Soal sesuai array Random indeks pemain
        let currentDBIdx = playerSequence[p][playerStageIndex[p]];
        let pData = stagesDB[currentDBIdx];
        
        let header = `
            <div class="panel-header">
                <span class="p-text-color-${p}">Kel. ${p} | Tantangan ${playerStageIndex[p] + 1}/7</span>
                <span class="score-badge" id="score-p${p}">Skor: ${playerScores[p]}</span>
            </div>
        `;
        
        let content = `<div class="panel-content" id="content-p${p}">`;
        content += `<div class="question-badge">${pData.tag}</div> <br>`;
        content += `<div class="question-text">${pData.text}</div>`;
        
        // --- PG KOMPLEKS ---
        if (pData.type === 'pg') {
            let ops = shuffleArray(pData.options); // Acak opsi!
            ops.forEach(opt => {
                content += `
                    <label class="pg-opt">
                        <input type="checkbox" value="${opt.id}" data-correct="${opt.isCorrect}" class="pg-cb-p${p}">
                        ${opt.text}
                    </label>`;
            });
            content += `<button class="btn-action" onclick="checkPG(${p})">Kunci & Lanjut <i class="fa-solid fa-bolt"></i></button>`;
        } 
        // --- MENJODOHKAN ---
        else if (pData.type === 'match') {
            let lefts = shuffleArray(pData.pairs.map(x => ({ text: x.q, id: x.id })));
            let rights = shuffleArray(pData.pairs.map(x => ({ text: x.a, id: x.id })));
            
            content += `<div class="match-grid">
                <div class="match-col" id="mcol-l-p${p}">`;
            lefts.forEach(l => { content += `<div class="m-item m-left" data-id="${l.id}" onclick="selectMatch(${p}, 'l', this)">${l.text}</div>`; });
            content += `</div><div class="match-col" id="mcol-r-p${p}">`;
            rights.forEach(r => { content += `<div class="m-item m-right" data-id="${r.id}" onclick="selectMatch(${p}, 'r', this)">${r.text}</div>`; });
            content += `</div></div>`;
            matchProgress[p] = 0; // reset local state
        }
        // --- TTS ---
        else if (pData.type === 'crossword') {
            content += `<div class="cw-container">
                <div class="cw-clues">${pData.clues}</div>
                <div class="cw-grid">`;
            
            let cells = '';
            for(let row=0; row<11; row++) {
                for(let col=0; col<12; col++) {
                    let findMap = cwMap.find(m => m.y === row && m.x === col);
                    if(findMap) {
                        cells += `<div class="cw-cell">
                            ${findMap.n ? `<span class="cw-num">${findMap.n}</span>` : ''}
                            <input type="text" maxlength="1" class="cw-input cw-in-p${p}" data-ans="${findMap.c}">
                        </div>`;
                    } else {
                        cells += `<div class="cw-cell"></div>`;
                    }
                }
            }
            content += cells;
            content += `</div><button class="btn-action" onclick="checkCW(${p})">Kunci & Lanjut <i class="fa-solid fa-bolt"></i></button></div>`;
        }

        // Overlays & Toast placeholders
        content += `
            <div class="feedback-toast" id="toast-p${p}"></div>
            <div class="finish-overlay" id="overlay-p${p}"></div>
        </div>`; 

        panel.innerHTML = header + content;
        
        // Pasang event listener TTS
        if (pData.type === 'crossword') {
            panel.querySelectorAll('.cw-input').forEach(inp => {
                inp.addEventListener('input', function() {
                    if (this.value.length === 1) this.value = this.value.toUpperCase();
                });
            });
        }
    }

    // --- Feedbacks and Validators ---
    function showToast(p, suc, msg) {
        let toast = document.getElementById(`toast-p${p}`);
        toast.innerText = msg;
        toast.style.background = suc ? '#10b981' : '#ef4444';
        toast.style.opacity = 1;
        setTimeout(() => { toast.style.opacity = 0; }, 2000);
    }

    function correctAndProceed(p) {
        playerScores[p] += 10; // 10 Poin per soal
        let overlay = document.getElementById(`overlay-p${p}`);
        overlay.innerHTML = `
            <h3><i class="fa-solid fa-circle-check"></i> BENAR!</h3>
            <p>Melanjutkan ke tantangan ${playerStageIndex[p] + 2}...</p>
        `;
        overlay.classList.add('show');
        
        setTimeout(() => {
            playerStageIndex[p]++;
            renderPlayerStage(p);
        }, 1200);
    }

    function checkPG(p) {
        let cbs = document.querySelectorAll(`.pg-cb-p${p}`);
        let checkedAny = false;
        let isFullyCorrect = true;

        cbs.forEach(cb => {
            let isCorrect = cb.getAttribute('data-correct') === 'true';
            if(cb.checked) checkedAny = true;
            if(cb.checked !== isCorrect) isFullyCorrect = false;
        });

        if(!checkedAny) {
            showToast(p, false, "Centang minimal 1 jawaban!"); return;
        }
        if(isFullyCorrect) {
            correctAndProceed(p);
        } else {
            showToast(p, false, "Ups, masih salah! Pikirkan lagi.");
        }
    }

    // Matching mechanics State
    let matchSelection = { 1: {l: null, r: null}, 2: {l: null, r: null}, 3: {l: null, r: null}, 4: {l: null, r: null} };
    let matchProgress = { 1: 0, 2: 0, 3: 0, 4: 0 };
    
    function selectMatch(p, side, el) {
        if(el.classList.contains('matched')) return;
        
        document.getElementById(`mcol-${side}-p${p}`).querySelectorAll('.m-item').forEach(x => {
            if(!x.classList.contains('matched')) x.classList.remove('selected');
        });
        el.classList.add('selected');
        matchSelection[p][side] = el;
        
        if(matchSelection[p].l && matchSelection[p].r) {
            let leftId = matchSelection[p].l.getAttribute('data-id');
            let rightId = matchSelection[p].r.getAttribute('data-id');
            
            if(leftId === rightId) {
                // Benar
                matchSelection[p].l.classList.add('matched');
                matchSelection[p].r.classList.add('matched');
                matchSelection[p].l.classList.remove('selected');
                matchSelection[p].r.classList.remove('selected');
                matchProgress[p]++;
                
                if(matchProgress[p] === 4) { // Semua 4 terjodohkan
                    correctAndProceed(p);
                }
            } else {
                // Salah
                let eL = matchSelection[p].l; let eR = matchSelection[p].r;
                eL.classList.add('error'); eR.classList.add('error');
                showToast(p, false, "Itu bukan pasangannya!");
                setTimeout(() => { eL.classList.remove('error','selected'); eR.classList.remove('error','selected'); }, 600);
            }
            matchSelection[p] = {l: null, r: null};
        }
    }

    function checkCW(p) {
        let inps = document.querySelectorAll(`.cw-in-p${p}`);
        let ok = true; let empty = false;
        
        inps.forEach(i => {
            let v = i.value.toUpperCase();
            let a = i.getAttribute('data-ans');
            if(v === '') empty = true;
            if(v !== a) ok = false;
        });

        if(empty) showToast(p, false, "Masih ada kotak kosong!");
        else if(!ok) showToast(p, false, "Ada ejaan yang salah!");
        else correctAndProceed(p);
    }
</script>
</body>
</html>
